# =========================================================
# Window rules
# =========================================================

# Ignore maximize requests from apps
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_initial_focus on, match:class ^$, match:title ^$, match:float true

# =========================================================
# Workspace Rules
# =========================================================

# Browser to workspace 2
windowrule = workspace 2, match:class ^(firefox)$
windowrule = workspace 2, match:class ^(chromium)$
windowrule = workspace 2, match:class ^(Google-chrome)$

# Communication apps to workspace 3
windowrule = workspace 3, match:class ^(discord)$
windowrule = workspace 3, match:class ^(telegram-desktop)$
windowrule = workspace 3, match:class ^(Slack)$

# Music/Media to workspace 4
windowrule = workspace 4, match:class ^(Spotify)$
windowrule = workspace 4, match:class ^(vlc)$

# =========================================================
# File Dialogs (Float + Center)
# =========================================================

# Generic file dialogs
windowrule = float on, center on, match:title ^(Open File|Save File|Save As|Preferences|File Upload|Choose Files).*
windowrule = size 800 600, match:title ^(Open File|Save File|Save As).*

# KDE dialogs
windowrule = float on, center on, match:class ^(org\.kde\.kdialog|kdialog)$

# GTK file chooser
windowrule = float on, center on, match:class ^(xdg-desktop-portal-gtk)$

# XDG portals
windowrule = float on, center on, match:class ^(xdg-desktop-portal-kde)$

# =========================================================
# Specific Applications
# =========================================================

# Pavucontrol (Volume Control)
windowrule = float on, size 500 400, center on, pin on, match:class ^(org\.pulseaudio\.pavucontrol)$

# Blueman (Bluetooth Manager)
windowrule = float on, size 700 500, center on, match:class ^(blueman-manager)$

# nm-connection-editor (Network Manager)
windowrule = float on, size 700 500, center on, match:class ^(nm-connection-editor)$

# Calculator
windowrule = float on, size 400 500, center on, match:class ^(org.gnome.Calculator|gnome-calculator|qalculate-gtk)$

# Image viewers
windowrule = float on, center on, match:class ^(imv|feh|sxiv)$

# =========================================================
# Picture-in-Picture
# =========================================================

# Firefox PiP
windowrule = float on, pin on, size 640 360, match:title ^(Picture-in-Picture)$
windowrule = move (monitor_w-window_w-20) (monitor_h-window_h-20), match:title ^(Picture-in-Picture)$

# "Sharing" popup (Chrome/Meet/etc) - float + move to bottom-right
windowrule = float on, match:title ^(.*is sharing (your screen|a window)\.)$
windowrule = move (monitor_w-window_w-20) (monitor_h-window_h-20), match:title ^(.*is sharing (your screen|a window)\.)$

# =========================================================
# Steam
# =========================================================

# Steam main window - tile normally
windowrule = tile on, match:class ^(steam)$, match:title ^(Steam)$

# Steam popups - float
windowrule = float on, match:class ^(steam)$, match:title ^(Friends List|Screenshot Uploader|Steam - News).*
windowrule = center on, match:class ^(steam)$, match:title ^(Friends List|Screenshot Uploader).*

# Steam games - fullscreen workspace 5
windowrule = workspace 5, match:class ^(steam_app_.*)$
windowrule = fullscreen on, match:class ^(steam_app_.*)$

# =========================================================
# Development Tools
# =========================================================

# VS Code
windowrule = workspace 1, match:class ^(code-oss|Code|code)$

# JetBrains IDEs
windowrule = workspace 1, match:class ^(jetbrains-.*)$

# Android Studio
windowrule = workspace 1, match:class ^(jetbrains-studio)$

# =========================================================
# Idle Inhibit (prevent screen timeout)
# =========================================================

# Prevent sleep during video playback
windowrule = idle_inhibit focus, match:class ^(mpv|vlc|firefox)$, match:title ^(.*(YouTube|Twitch|Netflix).*)$

# Prevent sleep during games
windowrule = idle_inhibit fullscreen, match:class ^(steam_app_.*)$

# =========================================================
# Size/Position Rules
# =========================================================

# Maximum size for floating windows
windowrule = max_size 1600 900, match:float true

# =========================================================
# Special Rules
# =========================================================

# Telegram media viewer
windowrule = float on, center on, match:class ^(org.telegram.desktop)$, match:title ^(Media viewer)$

# GIMP (ВАЖНО): lookahead (?!...) в RE2 не работает, так что делаем безопасный эквивалент:
# float для всех окон gimp, но главное окно (GNU Image Manipulation Program) оставляем tiled.
windowrule = float on, match:class ^(gimp)$
windowrule = tile on, match:class ^(gimp)$, match:title ^(GNU Image Manipulation Program)$

# Discord - updater windows
windowrule = float on, match:class ^(discord)$, match:title ^(Discord Updater)$
